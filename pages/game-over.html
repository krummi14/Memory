<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory is over</title>
</head>

<body class="game_over_page">

    <section class="game_over">
        <h1>Game Over</h1>
        <div>
            <p>Final score</p>
            <section class="score_board">
                <div class="blue_player">
                    <img id="bluePlayerImg" src="" alt="blue player label">
                    <span id="blueCodingLabel"></span>
                    <span class="blue_player_score_counter">0</span>
                </div>

                <div class="orange_player">
                    <img id="orangePlayerImg" src="" alt="orange player label">
                    <span id="orangeCodingLabel"></span>
                    <span class="orange_player_score_counter">0</span>
                </div>
            </section>
        </div>
    </section>

    <dialog id="isWinner" class="winner_dialog">
        <img id="confetti" class="confetti" data-src="../assets/img/confetti.svg" alt="confetti">
        <section class="the_winner_is">
            <div>
                <p id="winnerFeedbackTitle">The winner is</p>
                <span id="winnerName"></span>
            </div>
            <img id="winnerImg" src="" alt="winner image">
            <button id="backToStart">Back to Start</button>
        </section>
    </dialog>

    <script type="module" src="../src/main.ts"></script>
</body>

</html>
